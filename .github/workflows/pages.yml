name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      GITHUB_PAGES: 'true'
      NEXT_PUBLIC_PORTFOLIO_DEMO: 'true'
      NEXT_PUBLIC_BASE_PATH: /sony-doja-vie-2
      NEXT_PUBLIC_URL: https://fmormah.github.io/sony-doja-vie-2
      NEXT_PUBLIC_AUTH_MODE: localhost
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/configure-pages@v5
      - run: node --test scripts/prepare-pages.test.mjs
      - name: Unit and integration tests
        run: npm run test:ci
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
